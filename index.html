<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header>
        <span class="logo"><a href="">To Do <div>List</div></a></span>

        <span class="contacts-container">
            <a href="https://github.com/joaoMdeASilva/to-do-list" target="_blank">
                <img src="./images/icons/github-mark-white.svg" alt="Github logo">
            </a>
            <a href="https://www.linkedin.com/in/joaomdeasilva" target="_blank">
                <img src="./images/icons/InBug-White.png" alt="LinkeIn logo">
            </a>
        </span>
    </header>

    <main>
        <div class="title-container">
            <h1>To Do List</h1>
            <span>Seu Gerenciador de<br>Tarefas</span>
        </div>

        <div class="btns-container">
            <button>Nova Lista</button>
            <div class="imp-btn-container">
                <button>Importar uma lista</button>

                <span class="btn-imp-description">
                    Importe arquivos com o formato SVG
                </span>
            </div>
        </div>
    </main>

    <footer>
        <div>
            Feito por João Marcos
        </div>
    </footer>
</body>

</html>
